<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nox | Social Media</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Prevents scrollbars completely */
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f12;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 420px;
      max-height: calc(100vh - 32px); /* Ensures the card never exceeds screen height */
      text-align: center;
      padding: 24px 20px;
      border-radius: 24px;
      background: #18181d;
      border: 1px solid #2b2b33;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .profile-pic {
      width: clamp(70px, 18vh, 110px);
      height: clamp(70px, 18vh, 110px);
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(20px, 4vh, 26px);
      margin-bottom: 4px;
    }

    .username {
      color: #a7a7b0;
      font-size: clamp(13px, 2.5vh, 15px);
      margin-bottom: 18px;
    }

    .social-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: clamp(10px, 2vh, 14px) 16px;
      border-radius: 13px;
      background: #24242b;
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(14px, 2.2vh, 16px);
      font-weight: 600;
      transition: 0.2s ease;
    }

    .social-links a:hover {
      transform: translateY(-2px);
      background: #303039;
    }

    .icon {
      margin-right: 8px;
    }

    footer {
      margin-top: 16px;
      color: #777780;
      font-size: 12px;
    }

    /* Extra tight layout for very small height screens */
    @media (max-height: 550px) {
      .card {
        padding: 16px;
      }
      .username {
        margin-bottom: 10px;
      }
      .social-links {
        gap: 8px;
      }
      footer {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- CHANGE YOUR PROFILE PICTURE HERE -->
    <img
      class="profile-pic"
      src="profile_id.jpg"
      alt="Profile Picture"
    >

    <!-- CHANGE YOUR NAME HERE -->
    <h1>Nox</h1>

    <!-- CHANGE YOUR USERNAME/BIO HERE -->
    <p class="username">BSIT 2A</p>

    <div class="social-links">

      <!-- CHANGE THE LINKS BELOW -->

      <a href="https://facebook.com/" target="_blank">
        <span class="icon">🔵</span> Facebook
      </a>

      <a href="https://instagram.com/" target="_blank">
        <span class="icon">📷</span> Instagram
      </a>

      <a href="https://tiktok.com/" target="_blank">
        <span class="icon">🎵</span> TikTok
      </a>

    </div>

    <footer>
      © 2026 Nox
    </footer>

  </main>

</body>
</html>
