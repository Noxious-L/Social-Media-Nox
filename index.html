<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nox | Social Media</title>

  <!-- Google Font: Bungee (Bold Hook Font) & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Prevents scrollbars completely */
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: 'Inter', sans-serif;
      background: #08080a;
      color: #ffffff;
    }

    /* Animated Neon Card Wrapper */
    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 26px;
      padding: 2px;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #00f2fe, #6b11ff);
      background-size: 300% 300%;
      animation: neonGlow 6s ease infinite;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.35),
                  0 0 50px rgba(107, 17, 255, 0.25);
    }

    @keyframes neonGlow {
      0% {
        background-position: 0% 50%;
        box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), 0 0 50px rgba(79, 172, 254, 0.2);
      }
      50% {
        background-position: 100% 50%;
        box-shadow: 0 0 30px rgba(107, 17, 255, 0.5), 0 0 60px rgba(255, 0, 128, 0.3);
      }
      100% {
        background-position: 0% 50%;
        box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), 0 0 50px rgba(79, 172, 254, 0.2);
      }
    }

    .card {
      width: 100%;
      max-height: calc(100vh - 36px);
      text-align: center;
      padding: 22px 18px;
      border-radius: 24px;
      background: #121216;
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .profile-pic {
      width: clamp(60px, 15vh, 95px);
      height: clamp(60px, 15vh, 95px);
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      margin-bottom: 8px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    h1 {
      font-size: clamp(18px, 3.4vh, 24px);
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .username {
      color: #9494a0;
      font-size: clamp(12px, 2.1vh, 14px);
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .social-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Standard Button Base */
    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: clamp(8px, 1.6vh, 12px) 16px;
      border-radius: 14px;
      background: #1d1d24;
      color: #ffffff;
      text-decoration: none;
      
      font-family: 'Bungee', cursive;
      font-size: clamp(13px, 2.1vh, 16px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Brand Hover Effects */
    .social-links a.facebook:hover {
      background: #1877f2;
      border-color: #1877f2;
      box-shadow: 0 0 20px rgba(24, 119, 242, 0.5);
      transform: translateY(-2px) scale(1.02);
    }

    .social-links a.instagram:hover {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      border-color: #dc2743;
      box-shadow: 0 0 20px rgba(220, 39, 67, 0.5);
      transform: translateY(-2px) scale(1.02);
    }

    .social-links a.tiktok:hover {
      background: #000000;
      border-color: #ff0050;
      box-shadow: -3px 3px 18px rgba(255, 0, 80, 0.6), 3px -3px 18px rgba(0, 242, 234, 0.6);
      transform: translateY(-2px) scale(1.02);
    }

    /* Interactive Dropdown Image Gallery Container */
    .image-dropdown-container {
      width: 100%;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Toggle Button ("View Images") */
    .view-images-btn {
      background: none;
      border: none;
      color: #00f2fe;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .view-images-btn:hover {
      color: #4facfe;
      transform: translateY(-1px);
    }

    .view-images-btn span {
      font-size: 10px;
      transition: transform 0.3s ease;
    }

    /* Collapsible Gallery Box */
    .gallery-box {
      width: 100%;
      max-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: max-height 0.35s ease-in-out, padding 0.35s ease-in-out;
      padding: 0 4px;
      border-radius: 12px;
      scrollbar-width: thin;
      scrollbar-color: #4facfe #1d1d24;
    }

    /* Active state when expanded */
    .gallery-box.expanded {
      max-height: 190px;
      padding: 8px 4px;
      margin-top: 8px;
      background: rgba(29, 29, 36, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Custom Scrollbar for Gallery */
    .gallery-box::-webkit-scrollbar {
      width: 5px;
    }
    .gallery-box::-webkit-scrollbar-track {
      background: #121216;
      border-radius: 10px;
    }
    .gallery-box::-webkit-scrollbar-thumb {
      background: #4facfe;
      border-radius: 10px;
    }

    /* Auto-Fit Landscape Image Styling */
    .landscape-img {
      width: 100%;
      height: auto; /* Automatically respects original image proportions */
      max-height: 140px; /* Limits tall/large files from overflowing */
      object-fit: contain; /* Keeps the whole image visible without cropping */
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      background: #000000; /* Optional backdrop for image letterboxing if needed */
    }

    footer {
      margin-top: 12px;
      color: #666670;
      font-size: 11px;
      transition: all 0.3s ease;
    }

    /* Compact UI adaptation when gallery is open */
    .card.gallery-open .profile-pic {
      width: clamp(45px, 10vh, 65px);
      height: clamp(45px, 10vh, 65px);
      margin-bottom: 2px;
    }
    .card.gallery-open h1 {
      font-size: clamp(15px, 2.5vh, 19px);
    }
    .card.gallery-open .username {
      margin-bottom: 6px;
    }
    .card.gallery-open .social-links {
      gap: 6px;
    }

    /* Extra tight layout for low-height screen viewports */
    @media (max-height: 580px) {
      .card {
        padding: 12px;
      }
      .gallery-box.expanded {
        max-height: 120px;
      }
    }
  </style>
</head>

<body>

  <!-- Animated Outer Neon Wrapper -->
  <div class="card-wrapper">
    <main class="card" id="mainCard">

      <!-- PROFILE PICTURE -->
      <img
        class="profile-pic"
        src="profile_id.jpg"
        alt="Profile Picture"
      >

      <!-- NAME -->
      <h1>Nox</h1>

      <!-- USERNAME / BIO -->
      <p class="username">BSIT 2A</p>

      <!-- SOCIAL LINKS -->
      <div class="social-links">

        <a href="https://www.facebook.com/share/1BrXs4q9kU/" target="_blank" class="facebook">
          Facebook
        </a>

        <a href="https://www.instagram.com/nox.lloyd?dlrf=MWdtejZpNDI5cHo5dA==" target="_blank" class="instagram">
          Instagram
        </a>

        <a href="https://tiktok.com/@noxaintbored" target="_blank" class="tiktok">
          TikTok
        </a>

      </div>

      <!-- VIEW IMAGES DROPDOWN SECTION -->
      <div class="image-dropdown-container">
        <button class="view-images-btn" id="toggleGalleryBtn" onclick="toggleGallery()">
          View Images <span id="arrowIcon">▼</span>
        </button>

        <div class="gallery-box" id="galleryBox">
          <!-- AUTO-FIT LANDSCAPE IMAGES -->
          <img src="image1.jpg" alt="Gallery Image 1" class="landscape-img">
          <img src="image2.jpg" alt="Gallery Image 2" class="landscape-img">
          <img src="image3.jpg" alt="Gallery Image 3" class="landscape-img">
        </div>
      </div>

      <footer>
        © 2026 Nox
      </footer>

    </main>
  </div>

  <script>
    function toggleGallery() {
      const galleryBox = document.getElementById('galleryBox');
      const arrowIcon = document.getElementById('arrowIcon');
      const mainCard = document.getElementById('mainCard');
      const toggleBtn = document.getElementById('toggleGalleryBtn');

      galleryBox.classList.toggle('expanded');
      mainCard.classList.toggle('gallery-open');

      const isExpanded = galleryBox.classList.contains('expanded');
      
      if (isExpanded) {
        toggleBtn.innerHTML = 'Hide Images <span id="arrowIcon" style="transform: rotate(180deg); display: inline-block;">▲</span>';
      } else {
        toggleBtn.innerHTML = 'View Images <span id="arrowIcon" style="transform: rotate(0deg); display: inline-block;">▼</span>';
      }
    }
  </script>

</body>
</html>
