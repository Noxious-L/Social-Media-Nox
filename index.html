<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nox | Social Media</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 95vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f12;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 35px 25px;
      border-radius: 24px;
      background: #18181d;
      border: 1px solid #2b2b33;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .username {
      color: #a7a7b0;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .social-links a {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 13px;
      background: #24242b;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .social-links a:hover {
      transform: translateY(-2px);
      background: #303039;
    }

    .icon {
      margin-right: 8px;
    }

    footer {
      margin-top: 25px;
      color: #777780;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }

      .profile-pic {
        width: 105px;
        height: 105px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- CHANGE YOUR PROFILE PICTURE HERE -->
    <!-- Put your image in the same folder and change the filename -->
    <img
      class="profile-pic"
      src="profile_id.jpg"
      alt="Profile Picture"
    >

    <!-- CHANGE YOUR NAME HERE -->
    <h1>Nox</h1>

    <!-- CHANGE YOUR USERNAME/BIO HERE -->
    <p class="username"BSIT 2A</p>

    <div class="social-links">

      <!-- CHANGE THE LINKS BELOW -->

      <a href="https://facebook.com/" target="_blank">
        <span class="icon">🔵</span> Facebook
      </a>

      <a href="https://instagram.com/" target="_blank">
        <span class="icon">📷</span> Instagram
      </a>

      <a href="https://tiktok.com/" target="_blank">
        <span class="icon">🎵</span> TikTok
      </a>

      <a href="https://github.com/" target="_blank">
        <span class="icon">💻</span> GitHub
      </a>

      <a href="https://youtube.com/" target="_blank">
        <span class="icon">▶️</span> YouTube
      </a>

    </div>

    <footer>
      © 2026 Nox
    </footer>

  </main>

</body>
</html>
